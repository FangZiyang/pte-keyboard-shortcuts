<!doctype html>
<meta charset="utf-8">
<title>Repeat Sentence scored fixture</title>
<!--
  /rs after 录音 → AI 评分, shaped on the live page. The score card sits
  inside the question box under the toolbar: five rounded-2xl scores
  (总分, 发音准确, 流利度, 完整度, 录音识别度 %), five h-8 counts, the
  reference sentence one span per word, and a word-score table padded
  with "-" cells.

  This take: "to" omitted (struck through), "pass" mispronounced (amber),
  "um" inserted (red) — the inserted word is not part of the sentence.
  The mobile layout keeps a hidden second card.
-->

</div>

  </div>
  <div id="result">
<div class="rounded-lg border bg-white p-4 mb-2">

    <div class="flex flex-wrap items-center justify-between gap-5">
      <div class="flex items-center gap-3"><span class="inline-flex h-3 w-3 rounded-full bg-blue-500"></span><span>发音准确</span><span class="rounded-2xl bg-white px-4 py-2 text-2xl font-bold">58</span></div>

      <div class="border-b p-5"><div class="min-h-[220px] text-[18px] leading-[2.6rem]"><span class="mx-[2px] inline cursor-pointer transition hover:opacity-80 text-gray-800">You</span><span class=""> </span><span class="mx-[2px] inline cursor-pointer transition hover:opacity-80 text-gray-800">need</span><span class=""> </span><span class="mx-[2px] inline cursor-pointer transition hover:opacity-80 text-slate-400 line-through decoration-slate-400 decoration-2">to</span><span class=""> </span><span class="mx-[2px] inline cursor-pointer transition hover:opacity-80 bg-amber-100 text-amber-800">pass</span><span class=""> </span><span class="mx-[2px] inline cursor-pointer transition hover:opacity-80 bg-red-100 text-red-700">um</span><span class=""> </span><span class="mx-[2px] inline cursor-pointer transition hover:opacity-80 text-gray-800">the</span><span class=""> </span><span class="mx-[2px] inline cursor-pointer transition hover:opacity-80 text-gray-800">exam</span><span class="text-gray-800">.</span></div></div>

</div>
  </div>
</div>

<script>
  window.__clicks = [];
  document.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => window.__clicks.push(b.id));
  });

  // The download is a Blob, an object URL and an <a>.click(). jsdom has no
  // real download, so stand in for all three and keep the bytes the script
  // tried to hand over — that text is what the other repo has to parse.
  window.__downloads = [];
  const RealBlob = window.Blob;
  window.Blob = function (parts, opts) {
    window.__lastBlobText = (parts || []).join('');
    return new RealBlob(parts, opts);
  };
  window.URL.createObjectURL = () => 'blob:stub';
  window.URL.revokeObjectURL = () => {};
  const createElement = document.createElement.bind(document);
  document.createElement = (tag) => {
    const el = createElement(tag);
    if (tag === 'a') el.click = () => window.__downloads.push({ name: el.download, href: el.href });
    return el;
  };
</script>
